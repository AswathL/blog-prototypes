<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="../favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo credits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f1e7;
      --ink: #1f1a17;
      --muted: #6b625a;
      --line: #e2d8c6;
      --accent: #c8352b;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #17130f;
        --ink: #f3ece1;
        --muted: #a99d8f;
        --line: #352d25;
        --accent: #ff7a6b;
      }
    }
    :root[data-theme="dark"] {
      --bg: #17130f;
      --ink: #f3ece1;
      --muted: #a99d8f;
      --line: #352d25;
      --accent: #ff7a6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 Onest, system-ui, sans-serif;
      padding: clamp(24px, 6vw, 72px) 16px 64px;
    }
    main { max-width: 860px; margin: 0 auto; }
    a { color: var(--accent); }
    .top { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; flex-wrap: wrap; }
    h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.1; margin: 0 0 8px; font-weight: 800; letter-spacing: -0.02em; }
    p.lede { color: var(--muted); margin: 0 0 32px; max-width: 60ch; }
    button.lang {
      font: inherit; font-weight: 600; background: none; color: var(--ink);
      border: 1.5px solid var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer;
    }
    button.lang:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: grid; grid-template-columns: 72px 1fr; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); align-items: center; }
    li img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; background: var(--line); }
    .t { font-weight: 600; overflow-wrap: anywhere; }
    .m { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <a href="../" data-i18n="back"></a>
      <button class="lang" type="button" data-i18n="switch"></button>
    </div>
    <h1 data-i18n="title"></h1>
    <p class="lede" data-i18n="lede"></p>
    <ul id="list"></ul>
  </main>
  <script src="content.js"></script>
  <script src="site.js"></script>
  <script>
    const T = {
      bg: {
        back: '← Всички прототипи',
        switch: 'English',
        title: 'Снимки и автори',
        lede: 'Демо снимките в прототипите са от Wikimedia Commons и се използват според лиценза си. Истинският блог ще използва нейните снимки.',
        by: 'Автор',
        source: 'източник',
      },
      en: {
        back: '← All prototypes',
        switch: 'Български',
        title: 'Photo credits',
        lede: 'The demo photos in these prototypes come from Wikimedia Commons and are used under their licences. The real blog will use her own photos.',
        by: 'By',
        source: 'source',
      },
    };
    const list = document.getElementById('list');
    let credits = [];

    function render() {
      const s = T[Blog.lang];
      document.querySelectorAll('[data-i18n]').forEach((el) => (el.textContent = s[el.dataset.i18n]));
      document.title = s.title;
      list.replaceChildren(
        ...credits.map((c) => {
          const li = document.createElement('li');
          const img = document.createElement('img');
          img.src = Blog.thumbUrl(c.file);
          img.alt = '';
          img.loading = 'lazy';
          const info = document.createElement('div');
          const t = document.createElement('div');
          t.className = 't';
          t.textContent = c.title.replace(/^File:/, '');
          const m = document.createElement('div');
          m.className = 'm';
          const a = document.createElement('a');
          a.href = c.source;
          a.textContent = s.source;
          a.rel = 'noopener';
          a.target = '_blank';
          m.append(`${s.by}: ${c.author || '—'} · ${c.license} · `, a);
          info.append(t, m);
          li.append(img, info);
          return li;
        }),
      );
    }

    document.querySelector('button.lang').addEventListener('click', Blog.toggleLang);
    Blog.onLangChange(render);
    fetch('photos/credits.json')
      .then((r) => r.json())
      .then((data) => {
        credits = data;
        render();
      });
    render();
  </script>
</body>
</html>
