<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="../favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0a0f">
  <title>Бъркотия · снежна топка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+SC:wght@600;700&family=Literata:ital,wght@0,400;0,600;1,400&family=Onest:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="../shared/content.js"></script>
  <script src="../shared/site.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <div class="app" id="app">
    <canvas class="scene" id="scene" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <header class="top">
      <a class="brand" href="#/" id="brand">
        <span class="brand__name" data-t="siteName"></span>
        <span class="brand__tag" data-t="tagline"></span>
      </a>
      <div class="top__tools">
        <a class="pill listlink" href="#/list" id="listLink">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
          <span class="listlink__long" data-t="listView"></span>
          <span class="listlink__short" data-t="listViewShort"></span>
        </a>
        <button class="iconbtn sound" id="soundBtn" type="button" aria-pressed="false">
          <svg class="sound__off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
          <svg class="sound__on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
        </button>
        <div class="lang" data-lang-switch></div>
      </div>
    </header>

    <main class="stage" id="stage">
      <nav class="albums" id="albums" aria-labelledby="albumsLabel">
        <p class="albums__label" id="albumsLabel" data-t="albumsLabel"></p>
        <div class="albums__track" id="albumsTrack" role="radiogroup" aria-labelledby="albumsLabel"></div>
      </nav>

      <aside class="plaque" id="plaque" data-state="settling" aria-live="polite">
        <div class="plaque__settling">
          <p class="plaque__hint" id="plaqueHint"></p>
          <p class="plaque__sub"><span data-t="settling"></span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
        </div>
        <button class="plaque__photo" id="plaquePhoto" type="button">
          <span class="plaque__meta"><span id="plaqueAlbum"></span><span class="plaque__count" id="plaqueCount"></span></span>
          <span class="plaque__caption" id="plaqueCaption"></span>
          <span class="plaque__cta"><span data-t="lookCloser"></span> <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </button>
      </aside>

      <div class="actions">
        <button class="shake" id="shakeBtn" type="button">
          <span class="shake__icon" aria-hidden="true">
            <svg viewBox="0 0 32 32"><circle cx="16" cy="14" r="9.5"/><path d="M9 25.5h14M10.5 22.5l-1.5 3M21.5 22.5l1.5 3"/><path class="shake__flake" d="M16 9.5v9M12.1 11.75l7.8 4.5M12.1 16.25l7.8-4.5"/></svg>
          </span>
          <span class="shake__label" id="shakeLabel"></span>
        </button>
      </div>
    </main>

    <footer class="foot">
      <a href="../" class="foot__link"><span aria-hidden="true">←</span> <span data-t="prototypes"></span></a>
      <a class="foot__link" id="creditsLink" data-t="photoCredits"></a>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <div class="frost" id="frost" aria-hidden="true"></div>

  <section class="list" id="list" role="dialog" aria-modal="true" aria-labelledby="listTitle" hidden>
    <div class="list__inner">
      <header class="list__head">
        <h2 class="list__title" id="listTitle" tabindex="-1" data-t="allPosts"></h2>
        <div class="list__tools">
          <div class="lang lang--paper" data-lang-switch></div>
          <button class="closebtn" type="button" data-close="list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
      </header>
      <ol class="list__posts" id="listPosts"></ol>
      <h3 class="list__sub" data-t="gallery"></h3>
      <ul class="list__albums" id="listAlbums"></ul>
    </div>
  </section>

  <section class="reader" id="reader" role="dialog" aria-modal="true" aria-labelledby="readerTitle" hidden>
    <div class="reader__progress" aria-hidden="true"><i id="readerProgress"></i></div>
    <div class="reader__bar">
      <button class="reader__back" type="button" data-close="reader"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span data-t="backToList"></span></button>
      <div class="lang lang--paper" data-lang-switch></div>
    </div>
    <div class="reader__scroll" id="readerScroll">
      <article class="reader__article" id="readerArticle"></article>
    </div>
  </section>

  <section class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerCaption" hidden>
    <div class="viewer__bg" data-close="viewer"></div>
    <figure class="viewer__fig" id="viewerFig">
      <div class="viewer__print" id="viewerPrint">
        <img class="viewer__img" id="viewerImg" alt="">
      </div>
      <figcaption class="viewer__cap">
        <span class="viewer__meta"><span id="viewerAlbum"></span> <span class="viewer__count" id="viewerCount"></span></span>
        <span class="viewer__caption" id="viewerCaption"></span>
      </figcaption>
    </figure>
    <button class="viewer__nav viewer__nav--prev" type="button" id="viewerPrev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="viewer__nav viewer__nav--next" type="button" id="viewerNext"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="closebtn closebtn--dark viewer__close" type="button" data-close="viewer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </section>

  <div class="loader" id="loader" role="status">
    <svg class="loader__globe" viewBox="0 0 120 140" aria-hidden="true">
      <circle cx="60" cy="56" r="44"/>
      <path d="M22 106h76l-6 18H28z"/>
      <path d="M30 100c10-14 50-14 60 0"/>
      <g class="loader__snow"><circle cx="44" cy="40" r="1.6"/><circle cx="62" cy="30" r="1.4"/><circle cx="76" cy="46" r="1.8"/><circle cx="52" cy="60" r="1.3"/><circle cx="70" cy="66" r="1.5"/><circle cx="38" cy="70" r="1.2"/></g>
    </svg>
    <p class="loader__text" id="loaderText"></p>
  </div>
  <noscript><p style="color:#f3e9d8;padding:2rem;font-family:serif">This snow globe needs JavaScript.</p></noscript>
</body>
</html>
